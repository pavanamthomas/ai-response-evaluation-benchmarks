golden_response: |
  At an interior optimum, p = C_q(q*(p, w), w) and C_{qq} > 0. The value
  function is π*(p, w) = p q*(p, w) − C(q*(p, w), w). Differentiating
  with respect to p and substituting the FOC yields
  ∂π*/∂p = q*(p, w) + (p − C_q) ∂q*/∂p = q*(p, w).
  Equivalently, the envelope theorem says that the derivative of the
  optimized objective in a parameter equals the partial of the objective
  treating the control as fixed. Hotelling's lemma is that identity:
  output supply is the derivative of profit with respect to the output
  price.

  Regularity used: unique interior C^1 maximizer, so q* is differentiable
  by the implicit-function theorem from C_{qq} ≠ 0. If output were at a
  capacity bound, the envelope would be taken on the Lagrangian and
  ∂π*/∂p need not equal unconstrained q.

  Limitation: nondifferentiable costs produce a convex π* whose
  superdifferential contains q*, not necessarily a classical derivative.
evaluator_notes: |
  Passing fixture MATH-006. Do not require a citation of Hotelling.
assumptions:
  - Differentiable strictly convex C; interior unique maximizer.
validation_steps:
  - Recover ∂π*/∂p = q* from the FOC.
  - State interior unconstrained regularity.
  - Mention the constrained caveat.
