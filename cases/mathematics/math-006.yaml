id: MATH-006
domain: mathematics
title: Envelope theorem and Hotelling's lemma
prompt: |
  A competitive firm has a differentiable strictly convex cost function
  C(q, w) in output q and an input price w, and chooses q > 0 to maximize
  π(q, p, w) = p q − C(q, w). Using the envelope theorem, show that
  ∂π*/∂p = q*(p, w), and state the regularity used. No invented citations.
candidate_response: |
  Let q*(p, w) solve p − C_q(q, w) = 0 with C_{qq} > 0 so the FOC is
  sufficient. Profit at the optimum is π*(p, w) = p q*(p, w) − C(q*(p, w), w).
  Differentiating with respect to p,
  ∂π*/∂p = q* + (p − C_q) ∂q*/∂p = q*,
  because the FOC kills the second term. That is the envelope theorem for
  an unconstrained interior maximum: the indirect objective's derivative
  with respect to a parameter is the partial of the objective holding the
  control fixed. Hotelling's lemma is this identity: supply is the price
  derivative of profit. If a quantity constraint bound, one would need
  complementary slackness and the envelope would use the Lagrangian;
  here q is interior.

  Assumption: unique interior differentiable q*. Limitation: with kinks in
  C the supply correspondence can jump and the derivative may be a
  supergradient rather than a classical partial.
