id: MIX-005
domain: mixed
title: Congestion charge with incidence and second-best caveats
prompt: |
  A city can levy a cordon charge equal to a rough estimate of marginal
  external congestion cost at the peak. Outline the welfare argument,
  incidence, a second-best issue if transit is mispriced, and what would
  overturn the recommendation. No fake citations.
candidate_response: |
  If the charge is set at the marginal external cost of an extra PCU-km
  at the peak, and if other markets are undistorted, the first-order
  welfare gain is the usual Harberger triangle from reducing traffic to
  where MSB = MSC. Incidence: drivers with inelastic schedules pay more
  of the charge in money; those with elastic schedules "pay" in
  rescheduling or mode shift; landowners near the cordon can capture
  time savings in rents. If buses are underpriced and crowded, a cordon
  charge can over-shift cars onto a distorted substitute—second-best
  suggests a lower charge or a paired transit improvement.

  I would not treat the MEC number as known to the dollar: it depends on
  the value of time and on the speed-flow curve. A trial with measured
  speeds, and a distributional offset (lump-sum or transit), is part of
  the recommendation rather than an afterthought.

  Assumption: no substantial emission or accident externalities left
  unpriced, or they are absorbed into the same MEC. Limitation: political
  economy and cordon leakage (boundary parking) can erase the textbook
  triangle.
