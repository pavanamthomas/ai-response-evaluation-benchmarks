id: ECON-009
domain: economics
title: Cobb-Douglas shares via an invalid MRS argument
prompt: |
  Preferences are u = x1^{1/2} x2^{1/2}, prices p1 = 4, p2 = 4, income m = 40.
  Find Marshallian (x1, x2). Show the first-order conditions you use.
candidate_response: |
  Cobb-Douglas always spends equal shares, so x1 = 20/4 = 5 and x2 = 20/4 = 5.
  The derivation is MRS = MU1/MU2 = x2/x1. Set MRS = 1 because the goods are
  symmetric in the utility function, therefore x1 = x2. The budget 4x1 + 4x2
  = 40 then gives 8x1 = 40, x1 = 5, x2 = 5. That is the demand.
verdict: correct_result_invalid_reasoning
error_classification:
  - correct result with invalid reasoning
severity: MAJOR
earliest_failure_point: mathematical correctness
explanation: |
  The reported bundle (5, 5) is the correct Marshallian demand, but the
  argument sets MRS = 1 from "symmetry of u" rather than MRS = p1/p2. Here
  p1 = p2 so the two conditions coincide. The reasoning would fail if prices
  differed. Severity is MAJOR because the method is not one an examiner can
  trust.
corrected_reasoning: |
  Interior Cobb-Douglas FOC is MU1/MU2 = p1/p2, i.e. x2/x1 = p1/p2, hence
  p1 x1 = p2 x2 = m/2. With p1 = p2 = 4, m = 40, (x1, x2) = (5, 5). Do not
  replace p1/p2 by 1 from utility symmetry unless prices happen to be equal.
golden_response: |
  For u = x1^{1/2} x2^{1/2} and an interior budget, the Lagrangian FOCs are
  (1/2) x1^{-1/2} x2^{1/2} = λ p1 and (1/2) x1^{1/2} x2^{-1/2} = λ p2, so
  MRS = x2/x1 = p1/p2. Combined with p1 x1 + p2 x2 = m this yields the
  equal-share rule p1 x1 = p2 x2 = m/2, or x_i = (m/2)/p_i.

  Substituting p1 = 4, p2 = 4, m = 40 gives x1 = 5 and x2 = 5. Second-order
  conditions hold by strict quasiconcavity of u; the solution is interior.

  Setting MRS = 1 because the exponents are equal is not a FOC. That step
  happens to be numerically the same as x2/x1 = p1/p2 only because p1 = p2
  in this prompt. If p1 were 8 and p2 were 4, the same invalid step would
  still force x1 = x2 and miss the correct (2.5, 5).

  Limitation: a corner would require checking Inada/nonnegativity; here
  Inada conditions keep the optimum interior at positive prices.
evaluator_notes: |
  Known fixture: correct bundle, invalid MRS shortcut. Verdict must be
  correct_result_invalid_reasoning, not pass.
assumptions:
  - Interior solution; two goods, standard Cobb-Douglas.
  - Prices and income as stated.
validation_steps:
  - Confirm (5, 5) exhausts the budget and satisfies MRS = p1/p2.
  - Confirm the candidate set MRS = 1 from symmetry rather than from prices.
  - Note that a price perturbation would expose the error.
